        (c >= 0x200b && c <= 0x200f) ||
        (c >= 0x202a && c <= 0x202e) ||
        (c >= 0x2060 && c <= 0x2064) ||
        (c >= 0x2066 && c <= 0x2069) ||
        c === 0x3164 ||
        c === 0xfeff ||
        (c >= 0xfff9 && c <= 0xfffb) ||
        c === 0xffa0 ||
        (c >= 0xe0000 && c <= 0xe007f)
      ) {
        return true;
      }
    }
    return false;
  }

  function escapeAttr(v) {
    return String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  // Selector ladder: unique #id -> unique [data-*] -> structural
  // tag:nth-of-type path rooted at the nearest unique-id ancestor.
  function selectorFor(el) {
    if (el.id && !hasInvisibles(el.id) && isUnique("#" + CSS.escape(el.id))) {
      return "#" + CSS.escape(el.id);
    }
    for (var i = 0; i < el.attributes.length; i++) {
      var attr = el.attributes[i];
      if (
        attr.name.indexOf("data-") === 0 &&
        attr.value &&
        !hasInvisibles(attr.value)
      ) {
        var dataSel = "[" + attr.name + '="' + escapeAttr(attr.value) + '"]';
        if (isUnique(dataSel)) return dataSel;
      }
    }
    var parts = [];
    var cur = el;
    while (cur && cur !== document.body && cur.nodeType === 1 && parts.length < 10) {
      var sel = cur.tagName.toLowerCase();
      var parent = cur.parentElement;
      if (parent) {
        var sameTag = [];
        for (var c = 0; c < parent.children.length; c++) {
          if (parent.children[c].tagName === cur.tagName) sameTag.push(parent.children[c]);
        }
        if (sameTag.length > 1) {
          sel += ":nth-of-type(" + (sameTag.indexOf(cur) + 1) + ")";
        }
      }
      parts.unshift(sel);
      if (
        parent &&
        parent.id &&
        !hasInvisibles(parent.id) &&
        isUnique("#" + CSS.escape(parent.id))
      ) {
        parts.unshift("#" + CSS.escape(parent.id));
        return parts.join(" > ");
      }
      cur = parent;
    }
    if (cur === document.body) {
      parts.unshift("body");
      return parts.join(" > ");
    }
    // Depth cap hit without a root - an unrooted chain would match the
    // first structural pattern anywhere in the document. Mark the pin
    // detached instead of attaching it to the wrong element.
    return ":not(*)";
  }

  function descriptorFor(el) {
    var tag = "<" + el.tagName.toLowerCase() + ">";
    var idPart = el.id ? " #" + el.id : "";
    var text = visibleText(el).slice(0, 60);
    var textPart = text ? ' "' + text + '"' : "";
    // Nearest id'd ancestor, skipping the UCR-injected
    // #artifacts-component-root-* wrapper which is implementation noise.
    var section = el.parentElement;
    while (
      section &&
      (!section.id || section.id.indexOf("artifacts-component-root") === 0)
    ) {
      section = section.parentElement;
    }
    var sectionPart = section && section.id ? " in #" + section.id : "";
    return (tag + idPart + textPart + sectionPart).slice(0, 400);
  }

  // textContent offset of (node, offset) within body - the coordinate
  // system text-quote anchors are stored in. -1 when the boundary
  // isn't under body (shadow root, detached).
  function textOffset(node, offset) {
    var body = document.body;
    if (!body) return -1;
    try {
      var pre = document.createRange();
      pre.selectNodeContents(body);
      pre.setEnd(node, offset);
      return pre.toString().length;
    } catch (e) {
      return -1;
    }
  }

  // Inverse: build a Range covering [start, end) in body.textContent.
  function rangeForOffsets(start, end) {
    var body = document.body;
    if (!body) return null;
    var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    var acc = 0;
    var range = document.createRange();
    var haveStart = false;
    var t;
    while ((t = walker.nextNode())) {
      var next = acc + t.length;
      if (!haveStart && start < next) {
        range.setStart(t, start - acc);
        haveStart = true;
      }
      if (haveStart && end <= next) {
        range.setEnd(t, end - acc);
        return range;
      }
      acc = next;
    }
    return null;
  }

  // Context-scored search (W3C text-quote resolution): slice-check the
  // hint, else pick the occurrence whose surrounding chars best match
  // prefix/suffix. MIRRORS locateTextQuote() above line-for-line - the
  // tested export is the contract; this copy is what the sandbox runs.
  function locateQuote(text, q) {
    var ex = q.exact;
    if (!ex) return null;
    var hint = q.startOffset >= 0 ? q.startOffset : 0;
    if (text.slice(hint, hint + ex.length) === ex) {
      return { start: hint, end: hint + ex.length };
    }
    var best = -1;
    var bestScore = -1;
    var bestDist = Infinity;
    var scanned = 0;
    for (var idx = text.indexOf(ex); idx !== -1 && ++scanned <= 1000; idx = text.indexOf(ex, idx + 1)) {
      var before = text.slice(Math.max(0, idx - CONTEXT_LEN), idx);
      var after = text.slice(idx + ex.length, idx + ex.length + CONTEXT_LEN);
      var sc = 0;
      for (var i = 1; i <= q.prefix.length && i <= before.length; i++) {
        if (q.prefix[q.prefix.length - i] !== before[before.length - i]) break;
        sc++;
      }
      for (var j = 0; j < q.suffix.length && j < after.length; j++) {
        if (q.suffix[j] !== after[j]) break;
        sc++;
      }
      var dist = Math.abs(idx - hint);
      if (sc > bestScore || (sc === bestScore && dist < bestDist)) {
        best = idx;
        bestScore = sc;
        bestDist = dist;
      }
    }
    return best === -1 ? null : { start: best, end: best + ex.length };
  }

  function collectLineRects(range, cap) {
    var out = [];
    var rects = range.getClientRects();
    for (var i = 0; i < rects.length && out.length < cap; i++) {
      var r = rects[i];
      if (r.width > 0 && r.height > 0) {
        out.push({ x: r.left, y: r.top, w: r.width, h: r.height });
      }
    }
    return out;
  }

  function reportTextSel(full) {
    if (!port) return;
    var sel = window.getSelection();
    var r = sel && !sel.isCollapsed && sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
    if (!r || !document.body || !document.body.contains(r.commonAncestorContainer)) {
      if (hasTextSel) {
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
      }
      return;
    }
    hasTextSel = true;
    var br = r.getBoundingClientRect();
    var msg = {
      type: "textCapture",
      rect: { x: br.left, y: br.top, w: br.width, h: br.height },
      lineRects: collectLineRects(r, 80),
    };
    if (full) {
      var live = document.body.textContent || "";
      var so = textOffset(r.startContainer, r.startOffset);
      var eo = textOffset(r.endContainer, r.endOffset);
      if (so < 0 || eo < 0 || eo <= so) {
        // Unanchorable selection (shadow root, foreign node). A
        // rect-only post here would make the host pair the new rect
        // with a stale prior anchor - clear instead.
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
        return;
      }
      // Denomination invariant: exact/prefix/suffix are byte-identical
      // slices of body.textContent. Truncation adjusts endOffset so
      // the host's (endOffset - startOffset === exact.length) shape
      // check holds. Cut points back off surrogate halves - a lone
      // surrogate would never relocate and fails UTF-8 persist.
      var capped = Math.min(eo, so + EXACT_CAP);
      if (capped < eo) {
        var hc = live.charCodeAt(capped - 1);
        if (hc >= 0xd800 && hc <= 0xdbff) capped--;
      }
      if (capped <= so) {
        port.postMessage(msg);
        return;
      }
      var pStart = Math.max(0, so - CONTEXT_LEN);
      var pc = live.charCodeAt(pStart);
      if (pc >= 0xdc00 && pc <= 0xdfff) pStart++;
      var sEnd = Math.min(live.length, capped + CONTEXT_LEN);
      if (sEnd < live.length) {
        var sc = live.charCodeAt(sEnd - 1);
        if (sc >= 0xd800 && sc <= 0xdbff) sEnd--;
      }
      msg.exact = live.slice(so, capped);
      msg.prefix = live.slice(pStart, so);
      msg.suffix = live.slice(capped, sEnd);
      msg.startOffset = so;
      msg.endOffset = capped;
    }
    port.postMessage(msg);
  }

  function clearSelection() {
    if (selected) {
      selected.classList.remove(SEL_CLASS);
      selected = null;
    }
  }

  // rAF-throttled cursor + hover-rect stream so the host can paint the
  // inspector hover box (and knows the pointer is present) in comment mode.
  var cursorPending = false;
  var cursorX = -1;
  var cursorY = -1;
  function flushCursor() {
    cursorPending = false;
    if (!port) return;
    var hover = null;
    if (
      hoverEl &&
      hoverEl.nodeType === 1 &&
      hoverEl !== document.body &&
      hoverEl !== document.documentElement
    ) {
      var r = hoverEl.getBoundingClientRect();
      if (r.width > 0 || r.height > 0) {
        hover = { x: r.left, y: r.top, w: r.width, h: r.height };
      }
    }
    port.postMessage({ type: "cursor", x: cursorX, y: cursorY, hover: hover });
  }
  function scheduleCursor() {
    if (!cursorPending) {
      cursorPending = true;
      requestAnimationFrame(flushCursor);
    }
  }
  function onMouseMove(ev) {
    if (!mode || !port) return;
    // Over the scrollbar gutter (clientX/Y past the content box) - hide
    // the hover box like a leave.
    var de = document.documentElement;
    if (ev.clientX >= de.clientWidth || ev.clientY >= de.clientHeight) {
      cursorX = -1;
      cursorY = -1;
      hoverEl = null;
      scheduleCursor();
      return;
    }
    cursorX = ev.clientX;
    cursorY = ev.clientY;
    hoverEl = ev.target;
    scheduleCursor();
  }
  function onMouseLeave() {
    if (!mode || !port) return;
    cursorX = -1;
    cursorY = -1;
    hoverEl = null;
    scheduleCursor();
  }

  function onClick(ev) {
    if (!port) return;
    if (!mode) {
      // Mode off: don't intercept the page, just let the host close any
      // open popover (thread card click-away). A non-collapsed selection
      // means the click ended a drag-select - not a click-away.
      var s = window.getSelection();
      if (!s || s.isCollapsed) port.postMessage({ type: "clickAway" });
      return;
    }
    ev.preventDefault();
    ev.stopImmediatePropagation();
    var el = ev.target;
    if (!el || el.nodeType !== 1 || el === document.documentElement) return;
    if (el === document.body && el.firstElementChild) {
      // Pin on body is rarely intentional; keep it anyway but as body.
    }
    clearSelection();
    selected = el;
    el.classList.add(SEL_CLASS);
    var rect = el.getBoundingClientRect();
    var pinX = rect.width > 0 ? (ev.clientX - rect.left) / rect.width : 0.5;
    var pinY = rect.height > 0 ? (ev.clientY - rect.top) / rect.height : 0.5;
    port.postMessage({
      type: "capture",
      selector: selectorFor(el).slice(0, 1000),
      textHint: visibleText(el).slice(0, 300),
      descriptor: descriptorFor(el),
      pinX: Math.min(1, Math.max(0, pinX)),
      pinY: Math.min(1, Math.max(0, pinY)),
      clientX: ev.clientX,
      clientY: ev.clientY,
      rectLeft: rect.left,
      rectTop: rect.top,
    });
  }

  function reportRects() {
    rafPending = false;
    if (!port) return;
    // Selected element's live bounds - keeps the host's draft pin /
    // inspector tag / composer glued through scroll and reflow.
    if (selected) {
      var sr = selected.getBoundingClientRect();
      port.postMessage({
        type: "selRect",
        left: sr.left,
        top: sr.top,
        w: sr.width,
        h: sr.height,
        found:
          (sr.width > 0 || sr.height > 0) &&
          document.documentElement.contains(selected),
      });
    }
    var rects = [];
    for (var i = 0; i < pins.length; i++) {
      var p = pins[i];
      var el = null;
      try {
        el = document.querySelector(p.selector);
      } catch (e) {
        el = null;
      }
      if (!el) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      rects.push({
        id: p.id,
        x: r.left + p.pinX * r.width,
        y: r.top + p.pinY * r.height,
        found: true,
      });
    }
    var quoteRects = [];
    if (quotes.length > 0) {
      var live = null;
      for (var qi = 0; qi < quotes.length; qi++) {
        var q = quotes[qi];
        var qr = quoteRanges[q.id];
        if (qr === undefined) {
          if (live === null) {
            live = (document.body && document.body.textContent) || "";
          }
          var loc = locateQuote(live, q);
          qr = (loc && rangeForOffsets(loc.start, loc.end)) || null;
          quoteRanges[q.id] = qr;
        }
        // Zero paintable rects (display:none subtree) reports as
        // not-found so the host docks it as detached instead of
        // rendering nothing clickable.
        var qlr = qr ? collectLineRects(qr, 80) : [];
        quoteRects.push(
          qlr.length > 0
            ? { id: q.id, found: true, lineRects: qlr }
            : { id: q.id, found: false, lineRects: [] }
        );
      }
    }
    port.postMessage({
      type: "rects",
      rects: rects,
      quoteRects: quoteRects,
      scrollY: window.scrollY || 0,
    });
  }

  function scheduleRects() {
    if (rafPending) return;
    rafPending = true;
    var done = false;
    function run() {
      if (done) return;
      done = true;
      reportRects();
    }
    // rAF for paint alignment, with a timeout fallback - rAF is
    // suspended entirely in hidden tabs and pins must still settle
    // when the tab becomes visible after background loading.
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  function setMode(on) {
    mode = !!on;
    document.documentElement.toggleAttribute("data-cwhr-mode", mode);
    if (!mode) {
      hoverEl = null;
      clearSelection();
    }
  }

  function setComposing(open) {
    document.documentElement.toggleAttribute("data-cwhr-composing", !!open);
  }

  function onPortMessage(ev) {
    var data = ev.data;
    if (!data) return;
    if (data.type === "mode") setMode(data.on);
    else if (data.type === "composing") setComposing(data.open);
    else if (data.type === "pins") {
      pins = Array.isArray(data.pins) ? data.pins : [];
      scheduleRects();
    } else if (data.type === "quotes") {
      quotes = Array.isArray(data.quotes) ? data.quotes : [];
      quoteRanges = Object.create(null);
      scheduleRects();
    } else if (data.type === "clearSelection") {
      clearSelection();
    } else if (data.type === "clearTextSel") {
      var ts = window.getSelection();
      if (ts) ts.removeAllRanges();
      hasTextSel = false;
    } else if (data.type === "restoreScroll") {
      var ry = Number(data.y);
      if (isFinite(ry) && ry > 0) {
        // Apply now and again at load - late images/fonts can grow the
        // document after the first attempt clamps short.
        window.scrollTo(0, ry);
        window.addEventListener("load", function () {
          window.scrollTo(0, ry);
        });
      }
    }
  }

  function start() {
    injectStyle();
    var channel = new _MessageChannel();
    port = channel.port1;
    port.onmessage = onPortMessage;
    // Sandboxed srcdoc origins can be opaque; "*" is required. The
    // payload carries only the mount token (multiple sandboxes can be
    // mounted at once - the token routes the port to the right overlay)
    // and the channel port itself is pairwise-secure.
    _topPost(
      { type: READY_TYPE, token: "28b4bd54-7b7c-4571-b268-4a52bb5aff29" },
      "*",
      [channel.port2]
    );
    document.addEventListener("mousemove", onMouseMove, true);
    // documentElement (not document, capture) so this fires only when the
    // pointer leaves the viewport - capture-phase on document would fire for
    // every intra-document element-boundary crossing.
    document.documentElement.addEventListener("mouseleave", onMouseLeave);
    document.addEventListener("click", onClick, true);
    // Text-selection capture: commit on mouseup/keyup (Shift+Arrow),
    // clear on collapse. Not mode-gated; highlight-to-comment is
    // always on.
    function onSelCommit() { reportTextSel(true); }
    document.addEventListener("mouseup", onSelCommit, true);
    document.addEventListener("keyup", onSelCommit, true);
    document.addEventListener("selectionchange", function () {
      var s = window.getSelection();
      if (hasTextSel && (!s || s.isCollapsed)) reportTextSel(false);
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && port) port.postMessage({ type: "dismiss" });
    }, true);
    // Scroll/resize move the hovered element under a stationary pointer -
    // re-report its rect so the host's inspector box tracks it. Mutations
    // stay rects-only (animating pages would chatter the cursor stream).
    var textSelPending = false;
    function scheduleTextSel() {
      if (textSelPending) return;
      textSelPending = true;
      requestAnimationFrame(function () {
        textSelPending = false;
        reportTextSel(false);
      });
    }
    function onLayoutChange() {
      scheduleRects();
      if (mode && hoverEl) scheduleCursor();
      if (hasTextSel) scheduleTextSel();
    }
    window.addEventListener("scroll", onLayoutChange, true);
    window.addEventListener("resize", onLayoutChange);
    // Full-cache invalidate per childList mutation is acceptable: CSS
    // animation doesn't fire the observer; JS writers at frame rate
    // would re-relocate every frame but are rare. characterData isn't
    // observed, so .data= edits leave highlights stale until the next
    // childList mutation.
    var observer = new MutationObserver(function () {
      quoteRanges = Object.create(null);
      scheduleRects();
      if (hasTextSel) scheduleTextSel();
    });
    function observe() {
      if (document.body) observer.observe(document.body, { childList: true, subtree: true });
    }
    if (document.body) observe();
    else document.addEventListener("DOMContentLoaded", observe);
    // Settle pins after late layout (fonts, images).
    setInterval(scheduleRects, 2000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>

<title>シャドウタイム集計</title>
<style>
:root{--bg:#121318;--card:#1c1e26;--line:#2e313d;--text:#e8e9ee;--mute:#8b90a0;--gold:#ffd23f;--red:#ff5a5a;--white:#fff;--accent:#7f8cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding:10px max(8px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));max-width:640px;margin:0 auto}
input,button,textarea{font:inherit;font-size:16px;color:var(--text);background:#262a36;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px}
input:focus,button:focus-visible,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;touch-action:manipulation}
button:active{background:#323747}
textarea{width:100%;min-height:64px;padding:8px 10px;resize:vertical}
h2{font-size:15px;margin:14px 0 6px;color:var(--mute);font-weight:600}
.file{width:100%;font-size:18px;font-weight:700}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.stat input{width:100%}
.laps{font-size:28px;font-weight:700;line-height:44px}
.sub{font-size:11px;color:var(--mute)}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.head{display:flex;gap:4px;margin-bottom:4px}
.head input,.head button,.cell input,.cell button{min-height:36px}
.head .lab{width:3.7em;flex:none;text-align:center;padding:0 2px}

.head .mv:disabled{opacity:.3}
.grid,.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.cell{display:flex;gap:2px;justify-content:center}
.cell input{flex:1 1 auto;min-width:0;max-width:4em;text-align:center;padding:0 1px;font-weight:700;-moz-appearance:textfield;appearance:textfield}

.cell button{flex:none;width:30px;padding:0;font-weight:700}
.legend{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 6px 4px;margin-top:8px;font-size:12px;text-align:center}
.c-total{color:#aab1c8}.c-gold{color:var(--gold)}.c-red{color:var(--red)}.c-white{color:var(--white)}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}

<body id="artifacts-component-root-html">
<div id="app"></div>
<div id="toast" class=""></div>
<script id="embedded">window.__EMBEDDED__={"fileName":"shadow_time_counter","note":"","totalSymbols":0,"normal":[{"label":"S怨007","name":"ふぶき姫","total":2,"gold":0,"red":0,"white":1},{"label":"","name":"鬼食い","total":1,"gold":0,"red":0,"white":0},{"label":"","name":"ブリー隊長","total":0,"gold":0,"red":0,"white":0}],"special":[]};</script>
<script>
(function(){
var DKEY='ykw4d:',LAST='ykw4-last',DEFNAME='シャドウタイム集計';
var FIELDS=[['total','合計','c-total'],['gold','金魂','c-gold'],['red','赤魂','c-red'],['white','白魂','c-white']];
var state;

function blank(){return{fileName:DEFNAME,note:'',totalSymbols:0,normal:[],special:[]};}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function parse(s){try{var o=JSON.parse(s);return o&&typeof o==='object'?o:null;}catch(e){return null;}}
function int(v){v=parseInt(v,10);return isFinite(v)&&v>0?v:0;}
function clean(o){
  var b=blank();
  var s={fileName:String(o.fileName||b.fileName),note:String(o.note||''),totalSymbols:int(o.totalSymbols),normal:[],special:[]};
  ['normal','special'].forEach(function(k){
    (Array.isArray(o[k])?o[k]:[]).forEach(function(y){
      s[k].push({label:String(y.label||'').slice(0,5),name:String(y.name||'').slice(0,10),total:int(y.total),gold:int(y.gold),red:int(y.red),white:int(y.white)});
    });
  });
  return s;
}
function persist(){ls(DKEY+state.fileName,JSON.stringify(state));ls(LAST,state.fileName);}

function init(){
  var emb=window.__EMBEDDED__?clean(window.__EMBEDDED__):null;
  var local=null;
  if(emb){
    var raw=ls(DKEY+emb.fileName);
    local=raw&&parse(raw)?clean(parse(raw)):null;
    if(local&&JSON.stringify(local)!==JSON.stringify(emb)){
      state=confirm('このブラウザに未エクスポートの一時保存データがあります。\nOK：一時保存データを使う\nキャンセル：HTMLに保存されたデータを使う')?local:emb;
    }else state=emb;
  }else{
    var last=ls(LAST),r=last?ls(DKEY+last):null;
    state=r&&parse(r)?clean(parse(r)):blank();
  }
  persist();
  render();
}

function el(tag,props,kids){
  var e=document.createElement(tag);
  for(var k in props||{}){if(k==='text')e.textContent=props[k];else if(k==='cls')e.className=props[k];else e.setAttribute(k,props[k]);}
  (kids||[]).forEach(function(c){e.appendChild(c);});
  return e;
}
var lapsEl,lapsSub;
function updateLaps(){
  var sum=state.normal.reduce(function(a,y){return a+y.total;},0);
  lapsEl.textContent=state.totalSymbols>0?(sum/state.totalSymbols).toFixed(2):'-';
  lapsSub.textContent='通常合計 '+sum+' ÷ シンボル '+state.totalSymbols;
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on');},2200);}

var cardMap=new WeakMap();
function move(list,item,d){
  var i=list.indexOf(item),j=i+d;
  if(j<0||j>=list.length)return;
  var top=cardMap.get(item).getBoundingClientRect().top;
  list[i]=list[j];list[j]=item;persist();render();
  window.scrollBy(0,cardMap.get(item).getBoundingClientRect().top-top);
}
function row(list,item){
  var lab=el('input',{cls:'lab',maxlength:5,placeholder:'ラベル',value:item.label,'aria-label':'ラベル'});
  lab.addEventListener('input',function(){item.label=lab.value;persist();});
  var nm=el('input',{cls:'nm',maxlength:10,value:item.name,'aria-label':'妖怪名'});
  nm.addEventListener('input',function(){item.name=nm.value;persist();});
  var idx=list.indexOf(item);
  var up=el('button',{cls:'mv',text:'↑','aria-label':'上へ'});
  var dn=el('button',{cls:'mv',text:'↓','aria-label':'下へ'});
  var del=el('button',{cls:'mv',text:'✕','aria-label':'削除'});
  if(idx===0)up.disabled=true;
  if(idx===list.length-1)dn.disabled=true;
  up.addEventListener('click',function(){move(list,item,-1);});
  dn.addEventListener('click',function(){move(list,item,1);});
  del.addEventListener('click',function(){
    if(!confirm('「'+(item.name||'名前なし')+'」を削除しますか？'))return;
    list.splice(list.indexOf(item),1);persist();render();
  });
  var grid=el('div',{cls:'grid'});
  FIELDS.forEach(function(f){
    var k=f[0];
    var inp=el('input',{type:'number',inputmode:'numeric',min:0,value:item[k],'aria-label':f[1],cls:f[2]});
    inp.addEventListener('input',function(){item[k]=int(inp.value);persist();updateLaps();});
    inp.addEventListener('blur',function(){inp.value=item[k];});
    var btn=el('button',{text:'+1','aria-label':f[1]+'に+1',cls:f[2]});
    btn.addEventListener('click',function(){item[k]++;inp.value=item[k];persist();updateLaps();});
    grid.appendChild(el('div',{cls:'cell'},[inp,btn]));
  });
  var card=el('div',{cls:'card'},[el('div',{cls:'head'},[lab,nm,up,dn,del]),grid]);
  cardMap.set(item,card);
  return card;
}
function section(title,list){
  var box=el('div',{},[el('h2',{text:title+'（'+list.length+'）'})]);
  if(!list.length)box.appendChild(el('div',{cls:'empty',text:'上の入力欄から妖怪を追加してください'}));
  list.forEach(function(y){box.appendChild(row(list,y));});
  return box;
}

function render(){
  var y=window.scrollY;
  var app=document.getElementById('app');
  app.innerHTML='';
  var file=el('input',{cls:'file',value:state.fileName,'aria-label':'ファイル名'});
  file.addEventListener('change',function(){
    var old=state.fileName,nn=file.value.trim()||DEFNAME;
    if(nn!==old&&ls(DKEY+nn)!==null&&!confirm('同名の一時保存データを上書きします。よろしいですか？')){file.value=old;return;}
    ls(DKEY+old,null);state.fileName=nn;file.value=nn;persist();
  });
  var note=el('textarea',{placeholder:'備考','aria-label':'備考'});
  note.value=state.note;
  note.addEventListener('input',function(){state.note=note.value;persist();});
  app.appendChild(file);
  app.appendChild(el('div',{style:'margin-top:8px'},[note]));

  var sym=el('input',{type:'number',inputmode:'numeric',min:0,value:state.totalSymbols,'aria-label':'合計シンボル数'});
  sym.addEventListener('input',function(){state.totalSymbols=int(sym.value);persist();updateLaps();});
  sym.addEventListener('blur',function(){sym.value=state.totalSymbols;});
  lapsEl=el('div',{cls:'laps'});lapsSub=el('div',{cls:'sub'});
  app.appendChild(el('div',{cls:'top'},[
    el('div',{cls:'stat'},[el('label',{text:'合計シンボル数'}),sym]),
    el('div',{cls:'stat'},[el('label',{text:'周回数'}),lapsEl,lapsSub])
  ]));
  updateLaps();

  var nameIn=el('input',{maxlength:10,placeholder:'妖怪名（10文字まで）','aria-label':'追加する妖怪名'});
  function add(list){
    var n=nameIn.value.trim();
    if(!n){toast('妖怪名を入力してください');nameIn.focus();return;}
    list.push({label:'',name:n,total:0,gold:0,red:0,white:0});
    persist();render();
  }
  var b1=el('button',{text:'通常に追加'}),b2=el('button',{text:'特殊に追加'});
  b1.addEventListener('click',function(){add(state.normal);});
  b2.addEventListener('click',function(){add(state.special);});
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add(state.normal);}});
  app.appendChild(el('div',{cls:'add'},[nameIn,b1,b2]));

  app.appendChild(el('div',{cls:'legend'},[['c-total','合計'],['c-gold','金'],['c-red','赤'],['c-white','白']].map(function(x){return el('span',{cls:x[0],text:x[1]});})));
  app.appendChild(section('通常妖怪',state.normal));
  app.appendChild(section('特殊妖怪',state.special));

  var ex=el('button',{cls:'exp',text:'HTMLエクスポート'});
  ex.addEventListener('click',exportHtml);
  app.appendChild(ex);
  window.scrollTo(0,y);
}

async function exportHtml(){
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML='';
  clone.querySelector('#toast').textContent='';
  clone.querySelector('#toast').className='';
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  clone.querySelector('#embedded').textContent='window.__EMBEDDED__='+json+';';
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var name=state.fileName.replace(/[\\\/:*?"<>|]/g,'_')+'.html';
  if(window.showSaveFilePicker){
    try{
      var h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'HTML',accept:{'text/html':['.html']}}]});
      var w=await h.createWritable();await w.write(blob);await w.close();
      toast('保存しました');return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},10000);
  toast('ダウンロードを開始しました');
}

init();
})();
</script>


</body></html>
