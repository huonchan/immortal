<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>シャドウタイム集計</title>
<style>
:root{--bg:#121318;--card:#1c1e26;--line:#2e313d;--text:#e8e9ee;--mute:#8b90a0;--gold:#ffd23f;--red:#ff5a5a;--white:#fff;--accent:#7f8cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding:10px max(8px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));max-width:640px;margin:0 auto}
input,button,textarea{font:inherit;font-size:16px;color:var(--text);background:#262a36;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px}
input:focus,button:focus-visible,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;touch-action:manipulation}
button:active{background:#323747}
textarea{width:100%;min-height:64px;padding:8px 10px;resize:vertical}
h2{font-size:15px;margin:14px 0 6px;color:var(--mute);font-weight:600}
.file{width:100%;font-size:18px;font-weight:700}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.stat input{width:100%}
.laps{font-size:28px;font-weight:700;line-height:44px}
.sub{font-size:11px;color:var(--mute)}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.add input{flex:1 1 100%}
.add button{flex:1 1 0;background:var(--accent);border-color:var(--accent);color:#10121a;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;margin-bottom:6px}
.head{display:flex;gap:4px;margin-bottom:4px}
.head input,.head button,.cell input,.cell button{min-height:36px}
.head .lab{width:3.7em;flex:none;text-align:center;padding:0 2px}
.head .nm{flex:1;min-width:0;font-weight:600;padding:0 6px}
.head .mv{flex:none;width:32px;padding:0;color:var(--mute)}
.head .mv:disabled{opacity:.3}
.grid,.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.cell{display:flex;gap:2px;justify-content:center}
.cell input{flex:1 1 auto;min-width:0;max-width:4em;text-align:center;padding:0 1px;font-weight:700;-moz-appearance:textfield;appearance:textfield}
.cell input::-webkit-outer-spin-button,.cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell button{flex:none;width:30px;padding:0;font-weight:700}
.legend{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 6px 4px;margin-top:8px;font-size:12px;text-align:center}
.c-total{color:#aab1c8}.c-gold{color:var(--gold)}.c-red{color:var(--red)}.c-white{color:var(--white)}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
.exp+.exp{margin-top:10px}
.exp.sec{background:#262a36;border-color:var(--line);color:var(--text)}
.exp{width:100%;margin-top:22px;min-height:50px;background:var(--accent);border-color:var(--accent);color:#10121a;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#323747;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script id="embedded">window.__EMBEDDED__=null;</script>
<script>
(function(){
var DKEY='ykw4d:',LAST='ykw4-last',DEFNAME='シャドウタイム集計';
var FIELDS=[['total','合計','c-total'],['gold','金魂','c-gold'],['red','赤魂','c-red'],['white','白魂','c-white']];
var state;

function blank(){return{fileName:DEFNAME,note:'',totalSymbols:0,normal:[],special:[]};}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function parse(s){try{var o=JSON.parse(s);return o&&typeof o==='object'?o:null;}catch(e){return null;}}
function int(v){v=parseInt(v,10);return isFinite(v)&&v>0?v:0;}
function clean(o){
  var b=blank();
  var s={fileName:String(o.fileName||b.fileName),note:String(o.note||''),totalSymbols:int(o.totalSymbols),normal:[],special:[]};
  ['normal','special'].forEach(function(k){
    (Array.isArray(o[k])?o[k]:[]).forEach(function(y){
      s[k].push({label:String(y.label||'').slice(0,5),name:String(y.name||'').slice(0,10),total:int(y.total),gold:int(y.gold),red:int(y.red),white:int(y.white)});
    });
  });
  return s;
}
function persist(){ls(DKEY+state.fileName,JSON.stringify(state));ls(LAST,state.fileName);}

function init(){
  var emb=window.__EMBEDDED__?clean(window.__EMBEDDED__):null;
  var local=null;
  if(emb){
    var raw=ls(DKEY+emb.fileName);
    local=raw&&parse(raw)?clean(parse(raw)):null;
    if(local&&JSON.stringify(local)!==JSON.stringify(emb)){
      state=confirm('このブラウザに未エクスポートの一時保存データがあります。\nOK：一時保存データを使う\nキャンセル：HTMLに保存されたデータを使う')?local:emb;
    }else state=emb;
  }else{
    var last=ls(LAST),r=last?ls(DKEY+last):null;
    state=r&&parse(r)?clean(parse(r)):blank();
  }
  persist();
  render();
}

function el(tag,props,kids){
  var e=document.createElement(tag);
  for(var k in props||{}){if(k==='text')e.textContent=props[k];else if(k==='cls')e.className=props[k];else e.setAttribute(k,props[k]);}
  (kids||[]).forEach(function(c){e.appendChild(c);});
  return e;
}
var lapsEl,lapsSub;
function updateLaps(){
  var sum=state.normal.reduce(function(a,y){return a+y.total;},0);
  lapsEl.textContent=state.totalSymbols>0?(sum/state.totalSymbols).toFixed(2):'-';
  lapsSub.textContent='通常合計 '+sum+' ÷ シンボル '+state.totalSymbols;
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on');},2200);}

var cardMap=new WeakMap();
function move(list,item,d){
  var i=list.indexOf(item),j=i+d;
  if(j<0||j>=list.length)return;
  var top=cardMap.get(item).getBoundingClientRect().top;
  list[i]=list[j];list[j]=item;persist();render();
  window.scrollBy(0,cardMap.get(item).getBoundingClientRect().top-top);
}
function row(list,item){
  var lab=el('input',{cls:'lab',maxlength:5,placeholder:'ラベル',value:item.label,'aria-label':'ラベル'});
  lab.addEventListener('input',function(){item.label=lab.value;persist();});
  var nm=el('input',{cls:'nm',maxlength:10,value:item.name,'aria-label':'妖怪名'});
  nm.addEventListener('input',function(){item.name=nm.value;persist();});
  var idx=list.indexOf(item);
  var up=el('button',{cls:'mv',text:'↑','aria-label':'上へ'});
  var dn=el('button',{cls:'mv',text:'↓','aria-label':'下へ'});
  var del=el('button',{cls:'mv',text:'✕','aria-label':'削除'});
  if(idx===0)up.disabled=true;
  if(idx===list.length-1)dn.disabled=true;
  up.addEventListener('click',function(){move(list,item,-1);});
  dn.addEventListener('click',function(){move(list,item,1);});
  del.addEventListener('click',function(){
    if(!confirm('「'+(item.name||'名前なし')+'」を削除しますか？'))return;
    list.splice(list.indexOf(item),1);persist();render();
  });
  var grid=el('div',{cls:'grid'});
  FIELDS.forEach(function(f){
    var k=f[0];
    var inp=el('input',{type:'number',inputmode:'numeric',min:0,value:item[k],'aria-label':f[1],cls:f[2]});
    inp.addEventListener('input',function(){item[k]=int(inp.value);persist();updateLaps();});
    inp.addEventListener('blur',function(){inp.value=item[k];});
    var btn=el('button',{text:'+1','aria-label':f[1]+'に+1',cls:f[2]});
    btn.addEventListener('click',function(){item[k]++;inp.value=item[k];persist();updateLaps();});
    grid.appendChild(el('div',{cls:'cell'},[inp,btn]));
  });
  var card=el('div',{cls:'card'},[el('div',{cls:'head'},[lab,nm,up,dn,del]),grid]);
  cardMap.set(item,card);
  return card;
}
function section(title,list){
  var box=el('div',{},[el('h2',{text:title+'（'+list.length+'）'})]);
  if(!list.length)box.appendChild(el('div',{cls:'empty',text:'上の入力欄から妖怪を追加してください'}));
  list.forEach(function(y){box.appendChild(row(list,y));});
  return box;
}

function render(){
  var y=window.scrollY;
  var app=document.getElementById('app');
  app.innerHTML='';
  var file=el('input',{cls:'file',value:state.fileName,'aria-label':'ファイル名'});
  file.addEventListener('change',function(){
    var old=state.fileName,nn=file.value.trim()||DEFNAME;
    if(nn!==old&&ls(DKEY+nn)!==null&&!confirm('同名の一時保存データを上書きします。よろしいですか？')){file.value=old;return;}
    ls(DKEY+old,null);state.fileName=nn;file.value=nn;persist();
  });
  var note=el('textarea',{placeholder:'備考','aria-label':'備考'});
  note.value=state.note;
  note.addEventListener('input',function(){state.note=note.value;persist();});
  app.appendChild(file);
  app.appendChild(el('div',{style:'margin-top:8px'},[note]));

  var sym=el('input',{type:'number',inputmode:'numeric',min:0,value:state.totalSymbols,'aria-label':'合計シンボル数'});
  sym.addEventListener('input',function(){state.totalSymbols=int(sym.value);persist();updateLaps();});
  sym.addEventListener('blur',function(){sym.value=state.totalSymbols;});
  lapsEl=el('div',{cls:'laps'});lapsSub=el('div',{cls:'sub'});
  app.appendChild(el('div',{cls:'top'},[
    el('div',{cls:'stat'},[el('label',{text:'合計シンボル数'}),sym]),
    el('div',{cls:'stat'},[el('label',{text:'周回数'}),lapsEl,lapsSub])
  ]));
  updateLaps();

  var nameIn=el('input',{maxlength:10,placeholder:'妖怪名（10文字まで）','aria-label':'追加する妖怪名'});
  function add(list){
    var n=nameIn.value.trim();
    if(!n){toast('妖怪名を入力してください');nameIn.focus();return;}
    list.push({label:'',name:n,total:0,gold:0,red:0,white:0});
    persist();render();
  }
  var b1=el('button',{text:'通常に追加'}),b2=el('button',{text:'特殊に追加'});
  b1.addEventListener('click',function(){add(state.normal);});
  b2.addEventListener('click',function(){add(state.special);});
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add(state.normal);}});
  app.appendChild(el('div',{cls:'add'},[nameIn,b1,b2]));

  app.appendChild(el('div',{cls:'legend'},[['c-total','合計'],['c-gold','金'],['c-red','赤'],['c-white','白']].map(function(x){return el('span',{cls:x[0],text:x[1]});})));
  app.appendChild(section('通常妖怪',state.normal));
  app.appendChild(section('特殊妖怪',state.special));

  var ex=el('button',{cls:'exp',text:'HTMLエクスポート'});
  ex.addEventListener('click',exportHtml);
  app.appendChild(ex);
  var tx=el('button',{cls:'exp sec',text:'TSVエクスポート'});
  tx.addEventListener('click',exportTsv);
  app.appendChild(tx);
  window.scrollTo(0,y);
}

function safeName(){return state.fileName.replace(/[\\\/:*?"<>|]/g,'_');}
async function saveFile(blob,name,mime,ext,desc){
  if(window.showSaveFilePicker){
    try{
      var acc={};acc[mime]=[ext];
      var h=await window.showSaveFilePicker({suggestedName:name,types:[{description:desc,accept:acc}]});
      var w=await h.createWritable();await w.write(blob);await w.close();
      toast('保存しました');return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},10000);
  toast('ダウンロードを開始しました');
}
function exportHtml(){
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML='';
  clone.querySelector('#toast').textContent='';
  clone.querySelector('#toast').className='';
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  clone.querySelector('#embedded').textContent='window.__EMBEDDED__='+json+';';
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  saveFile(new Blob([html],{type:'text/html;charset=utf-8'}),safeName()+'.html','text/html','.html','HTML');
}
function exportTsv(){
  function cell(v){return String(v).replace(/[\t\r\n]+/g,' ');}
  var lines=[['ラベル名','名前','合計','金魂','赤魂','白魂'].join('\t')];
  [['通常妖怪シンボル',state.normal],['特殊妖怪シンボル',state.special]].forEach(function(sec){
    lines.push(sec[0]);
    sec[1].forEach(function(y){
      lines.push([cell(y.label),cell(y.name),y.total,y.gold,y.red,y.white].join('\t'));
    });
  });
  var text='\uFEFF'+lines.join('\r\n')+'\r\n';
  saveFile(new Blob([text],{type:'text/tab-separated-values;charset=utf-8'}),safeName()+'.tsv','text/tab-separated-values','.tsv','TSV');
}

init();
})();
</script>
</body>
</html>
